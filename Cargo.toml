[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/v0l/sims"

[workspace.dependencies]
sims-field = { path = "crates/sims-field" }
sims-rf = { path = "crates/sims-rf" }
sims-circuit = { path = "crates/sims-circuit" }
sims-quasistatic = { path = "crates/sims-quasistatic" }
sims-progress = { path = "crates/sims-progress" }
sims-tet = { path = "crates/sims-tet" }
sims-fem = { path = "crates/sims-fem" }
cgmath = { version = "0.18", features = ["serde"] }
anyhow = "1"
bytemuck = "1.25"
rayon = "1.11"
wgpu = "29"
pollster = "0.4"
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
