[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/v0l/sims"

[workspace.dependencies]
fieldgrid = { path = "crates/fieldgrid" }
bytemuck = "1.25"
rayon = "1.11"
wgpu = "29"
pollster = "0.4"
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
num-complex = "0.4"
